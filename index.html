<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creator Hub</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <p class="eyebrow">Creator Hub</p>
        <h1>Pick an app to launch</h1>
        <p class="lede">
          A single entry point for every tool. Add new apps below as they come
          online.
        </p>
      </header>

      <section class="grid">
        <a class="card" href="./apps/schedule-maker/" aria-label="Open Schedule Maker">
          <div class="pill">Available</div>
          <h2>Schedule Maker</h2>
          <p>Create and export polished schedules in minutes.</p>
          <span class="cta">Open app →</span>
        </a>

        <div class="card card--muted" aria-hidden="true">
          <div class="pill pill--muted">Coming soon</div>
          <h2>More tools</h2>
          <p>Add your next app link here to keep everything one click away.</p>
        </div>
      </section>
    </div>
  </body>
</html>
